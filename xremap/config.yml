virtual_modifiers:
  - CapsLock

modmap:
  - remap:
      LEFTALT: RIGHTSHIFT
      CapsLock:
        held: CapsLock
        alone: ESC
      ESC: CAPSLOCK
      LEFTMETA: RIGHTALT
      RIGHTALT: LEFTMETA

keymap:
  - name: Global and CapsNav
    remap:
      RIGHTSHIFT-SPACE: ENTER
      Super-c: ESC
      RIGHTALT-c: ESC
      # Caps-Nav Layer (Held = Nav/Edit, Tap = Esc)
      CapsLock-h: Left
      CapsLock-j: Down
      CapsLock-k: Up
      CapsLock-l: Right
      CapsLock-u: C-z

  - name: Strict Fast Editing
    exact_match: true
    remap:
      Super-o: Backspace
      Super-p: C-Backspace

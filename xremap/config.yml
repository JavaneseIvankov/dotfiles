virtual_modifiers:
  - CapsLock

modmap:
  - remap:
      LEFTALT: RIGHTSHIFT
      CapsLock:
        held: CapsLock
        alone: ESC
      ESC: CAPSLOCK
      LEFTMETA: RIGHTALT
      RIGHTALT: LEFTMETA

keymap:
  - remap:
      RIGHTSHIFT-SPACE: ENTER
      Super-c: ESC
      RIGHTALT-c: ESC
      # Caps-Nav Layer (Arrow keys)
      CapsLock-h: Left
      CapsLock-j: Down
      CapsLock-k: Up
      CapsLock-l: Right
      # Fast Editing (Right Alt held / Dual-Thumb held)
      Super-o: Backspace
      Super-p: C-Backspace
      Super-Shift_R-o: Backspace
      Super-Shift_R-p: C-Backspace
      Super-Shift_R-u: C-z

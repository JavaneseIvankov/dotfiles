# ==============================================================================
# General & Performance Settings
# ==============================================================================

# Eliminate the delay after pressing Escape / Meta keys (default is 500ms)
set -s escape-time 10

# Increase scrollback buffer history
set -g history-limit 50000

# Enable full 24-bit TrueColor and mouse support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on

# Start window and pane numbering at 1 instead of 0 for easier keyboard reach
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable focus events (required for Neovim autoread and smart focus switching)
set -g focus-events on


# ==============================================================================
# Ergonomic Alt (M-) Pane Navigation
# ==============================================================================

# Check if the active pane is running Vim / Neovim / fzf
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Move between panes without a prefix using Alt + hjkl (passes through to Vim)
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'


# ==============================================================================
# Pane Resizing (Alt + Shift + HJKL)
# ==============================================================================

# Direct pane resizing by 5 cells without needing prefix
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5


# ==============================================================================
# Ergonomic Splits & Window Management
# ==============================================================================

# Split panes in current directory using Alt + | (horizontal) and Alt + - (vertical)
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n 'M--' split-window -v -c "#{pane_current_path}"

# Toggle zoom on the current pane using Alt + z
bind -n M-z resize-pane -Z

# Create and cycle windows directly
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window

# Quick switch to windows 1-9 via Alt + [1-9]
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# ==============================================================================
# Config Reload Shortcut
# ==============================================================================

# Reload tmux configuration instantly with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ==============================================================================
# Kill Pane & Window
# ==============================================================================

# Kill pane aktif (Alt + x)
bind -n M-x kill-pane

# Kill window aktif beserta seluruh split di dalamnya (Alt + Shift + X)
bind -n M-X kill-window
